[env:mkrwifi1010]
platform = atmelsam
board = mkrwifi1010
framework = arduino
build_flags = 
	-DMNDEBUG
	-DTELNET
lib_deps = 
	arduino-libraries/WiFiNINA
	arduino-libraries/Arduino_SpiNINA
	finitespace/BME280@^3.0.0
	khoih-prog/FlashStorage_SAMD
	https://github.com/naylom/OnboardingServer.git#f2b873cc5dfbe6b6043698182423f6e2bd292591
	symlink://../InputPin
	symlink://../OutputPin
lib_extra_dirs = 
	C:\PlatformIO_GlobalLibs
	F:\Users\Mark Naylor\OneDrive\Documents\Arduino\libraries
